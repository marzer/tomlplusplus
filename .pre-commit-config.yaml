default_language_version:
    python: python3
    node: lts

exclude: ^(vendor/|toml[.]hpp$|tests/conformance_|include/toml[+][+]/impl/unicode_autogenerated[.]hpp$|docs/images/)

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-toml
          - id: check-yaml
          - id: end-of-file-fixer
          - id: mixed-line-ending
            args: [--fix=lf]
          - id: trailing-whitespace
            exclude: "[.]md$"
            exclude_types: [c++, c]

    - repo: https://github.com/pre-commit/mirrors-clang-format
      rev: v22.1.8
      hooks:
          - id: clang-format
            types_or: [c++, c]

    - repo: local
      hooks:
          - id: regenerate
            name: regenerate toml.hpp and other derived files
            entry: python tools/regenerate.py
            language: python
            pass_filenames: false
            always_run: true

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.3
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.10
      hooks:
          - id: prettier
            types_or: [markdown]
            exclude: ^(docs/|CHANGELOG[.]md$|[.]github/ISSUE_TEMPLATE/)

    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1
      hooks:
          - id: shellcheck

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint
