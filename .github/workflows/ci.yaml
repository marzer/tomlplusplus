name: ci

on:
    push:
        branches-ignore:
            - "gh-pages"
        paths:
            - "**.h"
            - "**.hpp"
            - "**.cpp"
            - "**.inl"
            - "**.py"
            - "**/meson.build"
            - "**/workflows/**.yaml"
    pull_request:
        branches-ignore:
            - "gh-pages"
        paths:
            - "**.h"
            - "**.hpp"
            - "**.cpp"
            - "**.inl"
            - "**.py"
            - "**/meson.build"
            - "**/workflows/**.yaml"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    linux:
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - "clang++"
                    - "g++"
                type:
                    - "debug"
                    - "release"

        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        env:
            CXX: ${{ matrix.compiler }}

        steps:
            - name: Install base dependencies
              run: |
                  sudo apt -y update
                  sudo apt -y install --no-install-recommends ninja-build locales-all

            - uses: actions/checkout@v7

            - name: Install python dependencies
              run: |
                  pipx install meson
                  pip3 install --user --no-cache-dir --upgrade -r tools/requirements.txt

            - name: Print tool versions
              run: |
                  grep PRETTY_NAME /etc/os-release
                  "$CXX" --version
                  meson --version
                  ninja --version
                  python3 --version

            - name: Check toml.hpp
              run: |
                  cd tools
                  python3 ci_single_header_check.py

            - name: Configure Meson
              run: meson setup build --buildtype=${{ matrix.type }} -Ddevel=true -Db_lto=false

            - name: Build
              run: meson compile -C build

            - name: Test
              run: meson test -C build --verbose

    windows:
        strategy:
            fail-fast: false
            matrix:
                type:
                    - "debug"
                    - "release"
                permissive:
                    - false
                    - true
                arch:
                    - name: "x64"
                      runner: "windows-2022"
                    - name: "arm64"
                      runner: "windows-11-arm"
        runs-on: ${{ matrix.arch.runner }}

        defaults:
            run:
                shell: cmd

        steps:
            - name: Install dependencies
              run: |
                  python3 -m pip install -U pip
                  pip3 install meson ninja

            - uses: actions/checkout@v7

            - uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: ${{ matrix.arch.name }}

            - name: Configure Meson
              run: meson setup build --vsenv --buildtype=${{ matrix.type }} -Ddevel=true -Db_lto=false -Dpermissive=${{ matrix.permissive }}

            - name: Build
              run: meson compile -C build

            - name: Test
              run: meson test -C build --verbose
