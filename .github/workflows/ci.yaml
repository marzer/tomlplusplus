name: ci

on:
    push:
        branches-ignore:
            - "gh-pages"
        paths:
            - "**.h"
            - "**.hpp"
            - "**.cpp"
            - "**.cppm"
            - "**.inl"
            - "**.py"
            - "**/meson.build"
            - "**/CMakeLists.txt"
            - "**.cmake"
            - "**.in"
            - "**/workflows/**.yaml"
            - "pyproject.toml"
            - "tests/sources.txt"
            - "VERSION.txt"
            - "LICENSE"
    pull_request:
        branches-ignore:
            - "gh-pages"
        paths:
            - "**.h"
            - "**.hpp"
            - "**.cpp"
            - "**.cppm"
            - "**.inl"
            - "**.py"
            - "**/meson.build"
            - "**/CMakeLists.txt"
            - "**.cmake"
            - "**.in"
            - "**/workflows/**.yaml"
            - "pyproject.toml"
            - "tests/sources.txt"
            - "VERSION.txt"
            - "LICENSE"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
    generated:
        runs-on: ubuntu-latest

        permissions:
            contents: write

        outputs:
            sha: ${{ steps.commit.outputs.sha }}

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v7

            - name: Regenerate
              run: |
                  python3 tools/regenerate.py
                  git status --short

            - name: Commit to master
              id: commit
              if: github.repository == 'marzer/tomlplusplus' && github.ref == 'refs/heads/master'
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add --all
                    git commit -m 'regenerate derived files'
                    git pull --rebase origin master
                    git push origin HEAD:master
                  fi
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    pyright:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Install python dependencies
              run: python -m pip install -r tools/requirements.txt pyright

            - name: Run pyright
              run: pyright

    linux:
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - "clang++"
                    - "g++"
                type:
                    - "debug"
                    - "release"

        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        env:
            CXX: ${{ matrix.compiler }}

        steps:
            - name: Install base dependencies
              run: |
                  sudo apt -y update
                  sudo apt -y install --no-install-recommends ninja-build locales-all

            - uses: actions/checkout@v7

            - name: Install meson
              run: pipx install meson

            - name: Print tool versions
              run: |
                  grep PRETTY_NAME /etc/os-release
                  "$CXX" --version
                  meson --version
                  ninja --version
                  python3 --version

            - name: Configure Meson
              run: meson setup build --buildtype=${{ matrix.type }} -Ddevel=true -Db_lto=false

            - name: Build
              run: meson compile -C build

            - name: Test
              run: meson test -C build --verbose

            - name: Report regenerated files
              run: git status --short

    windows:
        strategy:
            fail-fast: false
            matrix:
                type:
                    - "debug"
                    - "release"
                permissive:
                    - false
                    - true
                arch:
                    - name: "x64"
                      runner: "windows-2022"
                    - name: "arm64"
                      runner: "windows-11-arm"
        runs-on: ${{ matrix.arch.runner }}

        defaults:
            run:
                shell: cmd

        steps:
            - name: Install dependencies
              run: |
                  python3 -m pip install -U pip
                  pip3 install meson ninja

            - uses: actions/checkout@v7

            - uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: ${{ matrix.arch.name }}

            - name: Configure Meson
              run: meson setup build --vsenv --buildtype=${{ matrix.type }} -Ddevel=true -Db_lto=false -Dpermissive=${{ matrix.permissive }}

            - name: Build
              run: meson compile -C build

            - name: Test
              run: meson test -C build --verbose

            - name: Report regenerated files
              run: git status --short

    cmake-linux:
        strategy:
            fail-fast: false
            matrix:
                compiler:
                    - "clang++"
                    - "g++"
                type:
                    - "Debug"
                    - "Release"
                library:
                    - "-Dtomlplusplus_BUILD_LIB=OFF"
                    - "-Dtomlplusplus_BUILD_LIB=ON -DBUILD_SHARED_LIBS=ON"

        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        env:
            CXX: ${{ matrix.compiler }}

        steps:
            - name: Install base dependencies
              run: |
                  sudo apt -y update
                  sudo apt -y install --no-install-recommends ninja-build locales-all

            - uses: actions/checkout@v7

            - name: Print tool versions
              run: |
                  cmake --version
                  ninja --version

            - name: Configure
              run: >-
                  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.type }}
                  -Dtomlplusplus_BUILD_TESTS=ON -DBUILD_EXAMPLES=ON -Dtomlplusplus_BUILD_TOML_TEST=ON
                  -Dtomlplusplus_PEDANTIC=ON -Dtomlplusplus_WERROR=ON
                  ${{ matrix.library }}

            - name: Build
              run: cmake --build build

            - name: Test
              working-directory: build
              run: ctest --output-on-failure

            - name: Report regenerated files
              run: git status --short

    cmake-windows:
        strategy:
            fail-fast: false
            matrix:
                type:
                    - "Debug"
                    - "Release"
                library:
                    - "-Dtomlplusplus_BUILD_LIB=OFF"
                    - "-Dtomlplusplus_BUILD_LIB=ON -DBUILD_SHARED_LIBS=ON"
                arch:
                    - name: "x64"
                      runner: "windows-2022"
                    - name: "arm64"
                      runner: "windows-11-arm"
        runs-on: ${{ matrix.arch.runner }}

        defaults:
            run:
                shell: cmd

        steps:
            - name: Install dependencies
              run: |
                  python3 -m pip install -U pip
                  pip3 install ninja

            - uses: actions/checkout@v7

            - uses: ilammy/msvc-dev-cmd@v1
              with:
                  arch: ${{ matrix.arch.name }}

            - name: Print tool versions
              run: |
                  cmake --version
                  ninja --version

            - name: Configure
              run: >-
                  cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=cl -DCMAKE_BUILD_TYPE=${{ matrix.type }}
                  -Dtomlplusplus_BUILD_TESTS=ON -DBUILD_EXAMPLES=ON -Dtomlplusplus_BUILD_TOML_TEST=ON
                  -Dtomlplusplus_PEDANTIC=ON -Dtomlplusplus_WERROR=ON
                  ${{ matrix.library }}

            - name: Build
              run: cmake --build build

            - name: Test
              working-directory: build
              run: ctest --output-on-failure

            - name: Report regenerated files
              run: git status --short

    cmake-floor:
        runs-on: ubuntu-latest

        defaults:
            run:
                shell: bash

        steps:
            - name: Install base dependencies
              run: |
                  sudo apt -y update
                  sudo apt -y install --no-install-recommends ninja-build locales-all

            - name: Install the oldest supported CMake
              run: |
                  python3 -m venv "$RUNNER_TEMP/cmake"
                  "$RUNNER_TEMP/cmake/bin/pip" install cmake==3.14.4.post1
                  echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

            - uses: actions/checkout@v7

            - name: Print tool versions
              run: |
                  cmake --version
                  ninja --version

            - name: Configure
              run: >-
                  cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
                  -Dtomlplusplus_BUILD_TESTS=ON -DBUILD_EXAMPLES=ON
                  -Dtomlplusplus_PEDANTIC=ON -Dtomlplusplus_WERROR=ON

            - name: Build
              run: cmake --build build

            - name: Test
              working-directory: build
              run: ctest --output-on-failure

    release:
        needs: [generated, pyright, linux, windows, cmake-linux, cmake-windows, cmake-floor]

        if: github.repository == 'marzer/tomlplusplus' && github.ref == 'refs/heads/master'

        runs-on: ubuntu-latest

        permissions:
            contents: write
            actions: write

        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ needs.generated.outputs.sha }}

            - name: Create release from VERSION.txt
              env:
                  GH_TOKEN: ${{ github.token }}
                  TARGET_SHA: ${{ needs.generated.outputs.sha }}
              run: |
                  version=$(tr -d '[:space:]' < VERSION.txt)
                  echo "VERSION.txt: $version"

                  tag="v$version"
                  if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                    echo "release with tag $tag already exists; nothing to do."
                    exit 0
                  fi

                  notes="This release was triggered automatically by a merge to \`$GITHUB_REF_NAME\`."
                  notes+='<br/><br/>'
                  notes+="See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md)"
                  notes+=' for a human-friendly change log. :tada:'

                  gh release create "$tag" toml.hpp \
                    --repo "$GITHUB_REPOSITORY" \
                    --target "$TARGET_SHA" \
                    --title "$tag" \
                    --generate-notes \
                    --notes "$notes"

                  gh workflow run docs.yaml --repo "$GITHUB_REPOSITORY" --ref master
